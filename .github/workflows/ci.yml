name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      # v2 of golangci-lint, matching .golangci.yml, needs action v7 or later.
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12
      - run: go test ./...
